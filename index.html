<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BASK</title>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">BASK <span id="subtitle">농구 선수 키우기</span></div>
        <div class="hright">
          <div class="seed" id="seedbox">경기 번호 <b id="seed">-</b></div>
          <div class="snd"><button type="button" id="btnSfx" title="효과음 켜기/끄기">효과음</button><button type="button" id="btnBgm" title="음악 켜기/끄기">음악</button></div>
        </div>
      </header>

      <section class="screen" id="scr-title"></section>
      <section class="screen" id="scr-create" hidden></section>
      <section class="screen" id="scr-home" hidden></section>
      <section class="screen" id="scr-result" hidden></section>

      <section class="screen" id="scr-game" hidden>
      <div class="careerbar" id="careerbar" hidden></div>
      <section class="board" aria-label="스코어보드">
        <div class="team t0"><span class="chip" id="chip0"></span><span class="tbox"><span class="tname" id="tname0">-</span><span class="tf" id="tf0"></span></span><span class="score" id="score0">0</span></div>
        <div class="clockbox">
          <div class="q" id="quarter">1Q</div>
          <div class="clock" id="clock">10:00</div>
          <div class="sc"><small>샷클락</small><span id="shotclock">24</span></div>
        </div>
        <div class="team t1"><span class="score" id="score1">0</span><span class="tbox"><span class="tname" id="tname1">-</span><span class="tf" id="tf1"></span></span><span class="chip" id="chip1"></span></div>
        <div class="progress"><i id="progress"></i></div>
      </section>
      <div class="defs"><span id="def0"></span><span id="def1"></span></div>

      <div class="main">
        <div class="courtcol">
          <div id="game"></div>
          <div class="controls">
            <button type="button" id="btnPlay" title="단축키 Space">❚❚ 일시정지</button>
            <div class="speeds" id="speeds"></div>
            <button type="button" id="btnSkip" title="단축키 Q">쿼터 넘기기</button>
            <button type="button" id="btnEnd">결과 보기</button>
            <button type="button" id="btnRestart">처음부터</button>
            <button type="button" id="btnNew" class="primary" title="단축키 N">새 경기</button>
            <button type="button" id="btnDone" class="primary" hidden>경기 결과로 ▶</button>
            <button type="button" id="btnBack" hidden>타이틀로</button>
          </div>
          <div class="controls modes" id="modes">
            <span class="lbl">보는 방법</span>
            <button type="button" data-mode="all" class="on">전체</button>
            <button type="button" data-mode="focus" title="선수 탭에서 고른 선수가 코트에 있을 때만">고른 선수만</button>
            <button type="button" data-mode="highlights" title="평소엔 빨리 감다가 덩크·3점·블록·스틸·화려한 동작·막판 접전은 1배속으로 (FM처럼)">하이라이트</button>
            <span class="modehint" id="modehint"></span>
          </div>
          <div class="controls modes" id="labels">
            <span class="lbl">이름표</span>
            <button type="button" data-label="number" title="단축키 L">번호</button>
            <button type="button" data-label="name" title="단축키 L">이름</button>
            <button type="button" data-label="off" title="단축키 L">끔</button>
          </div>
        </div>
        <aside class="panel">
          <nav class="tabs" id="tabs">
            <button type="button" data-tab="log" class="on">문자 중계</button>
            <button type="button" data-tab="box">박스스코어</button>
            <button type="button" data-tab="player">선수</button>
            <button type="button" data-tab="shots">샷차트</button>
            <button type="button" data-tab="flow">흐름</button>
          </nav>
          <div class="tab" id="tab-log"><ul class="log" id="log"></ul></div>
          <div class="tab" id="tab-box" hidden></div>
          <div class="tab" id="tab-player" hidden>
            <div class="roster" id="roster"></div>
            <div class="card" id="card"></div>
          </div>
          <div class="tab" id="tab-shots" hidden></div>
          <div class="tab" id="tab-flow" hidden><h3 class="ctitle">승리 확률</h3></div>
        </aside>
      </div>
      <footer class="foot">노란 화살표 = 고른 선수, 발밑 막대 = 지친 선수의 체력, 머리 위 별 = 앵클 브레이크·스크린에 걸린 선수. 단축키: Space 재생/정지 · 1~5 배속 · Q 쿼터 넘기기 · H 하이라이트 · N 새 경기 (데모)</footer>
      </section>
    </div>
    <div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
